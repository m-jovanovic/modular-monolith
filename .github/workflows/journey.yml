name: Equipment library journey
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
env:
  COMPOSE_PROJECT_NAME: eqlab-ci
jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Start the published host with real module-owned storage
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Check the public use-case inventory against the running application
        run: |
          python3 tools/api/inventory.py --markdown "$RUNNER_TEMP/use-cases.md"
          diff -u docs/use-cases.md "$RUNNER_TEMP/use-cases.md"
      - name: Race two borrowers and complete the staff workflow
        run: python3 tests/Journeys/borrow_a_drill.py
      - name: Kill the host after durable receipt and verify recovery
        run: python3 tests/Journeys/recover_delivery.py
      - name: Restore the pickup projection from a full PostgreSQL backup
        run: python3 tests/Journeys/restore_pickup.py
      - name: Verify role isolation and upgrades
        run: ./tests/Persistence/verify.sh
      - name: Collect diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 150

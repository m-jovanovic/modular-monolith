<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">One copy, one winning hold</title><desc id="desc">Two members request one copy. A conditional write claims availability. The hold and its outgoing fact commit together inside one PostgreSQL transaction.</desc>
<style>text{font-family:Barlow,system-ui,sans-serif}.title{font-size:32px;font-weight:700}.name{font-size:20px;font-weight:700}.body{font-size:15px}.cap,.edge-label{font-size:14px;font-weight:700}.conn{fill:none;stroke-width:2}.card,.frame{stroke-width:1.3}.bg{fill:#172c2a}text{fill:#f0f7f2}.muted{fill:#b4cbc1}.frame{fill:#1e3531;stroke:#b5d7c8}.a{fill:#2c5144}.b{fill:#534331}.c{fill:#314957}.card,.conn{stroke:#b5d7c8}.arrow{fill:#b5d7c8}</style>
<defs><marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="arrow" d="M0 0 L7 3.5 L0 7Z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="430" rx="12"/>
<text class="title" text-anchor="start" x="36" y="48">One copy, one winning hold</text>
<text class="body muted" text-anchor="start" x="36" y="80">A conditional write, the hold and its outgoing event share one Lending transaction.</text>
<rect class="frame" x="358" y="112" width="626" height="178" rx="12"/>
<text class="cap" text-anchor="start" x="374" y="135">One Lending transaction</text>
<g id="borrower">
<rect class="card a" x="36" y="169" width="245" height="98" rx="8"/>
<text class="name" text-anchor="start" x="49" y="198">Borrower</text>
<text class="body" text-anchor="start" x="49" y="224">Request the copy</text>
<text class="body muted" text-anchor="start" x="49" y="246">Two requests can race</text>
</g>
<g id="lending">
<rect class="card b" x="377" y="169" width="245" height="98" rx="8"/>
<text class="name" text-anchor="start" x="390" y="198">Lending</text>
<text class="body" text-anchor="start" x="390" y="224">Claim an available copy</text>
<text class="body muted" text-anchor="start" x="390" y="246">A losing request gets 409</text>
</g>
<g id="postgres">
<rect class="card c" x="718" y="169" width="245" height="98" rx="8"/>
<text class="name" text-anchor="start" x="731" y="198">PostgreSQL</text>
<text class="body" text-anchor="start" x="731" y="224">Commit the winning hold</text>
<text class="body muted" text-anchor="start" x="731" y="246">Outbox row commits with it</text>
</g>
<g id="reserve-request"><path d="M284 218 H372" class="conn" marker-end="url(#arrowhead)"/>
<text class="edge-label" text-anchor="middle" x="328" y="207">reserve</text>
</g>
<g id="commit-hold"><path d="M625 218 H713" class="conn" marker-end="url(#arrowhead)"/>
<text class="edge-label" text-anchor="middle" x="669" y="207">commit</text>
</g>
<rect class="frame" x="16" y="331" width="968" height="79" rx="10"/>
<text class="cap" text-anchor="start" x="32" y="357">The competing request</text>
<text class="body muted" text-anchor="start" x="32" y="383">A second update finds no available copy. The caller receives HTTP 409 and no second hold is written.</text>
</svg>

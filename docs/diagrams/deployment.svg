<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Running the equipment library</title><desc id="desc">A borrower or librarian sends HTTP to a single ASP.NET Core host. Request handlers and two background workers use three role-scoped data sources in a single PostgreSQL instance.</desc>
<style>text{font-family:Barlow,system-ui,sans-serif}.title{font-size:32px;font-weight:700}.name{font-size:20px;font-weight:700}.body{font-size:15px}.cap,.edge-label{font-size:14px;font-weight:700}.conn{fill:none;stroke-width:2}.card,.frame{stroke-width:1.3}.bg{fill:#f8faf6}text{fill:#153c37}.muted{fill:#57736b}.frame{fill:#ffffff;stroke:#416b60}.a{fill:#d8eade}.b{fill:#fae7cd}.c{fill:#ddecf4}.card,.conn{stroke:#416b60}.arrow{fill:#416b60}@media(prefers-color-scheme:dark){.bg{fill:#172c2a}text{fill:#f0f7f2}.muted{fill:#b4cbc1}.frame{fill:#1e3531;stroke:#b5d7c8}.a{fill:#2c5144}.b{fill:#534331}.c{fill:#314957}.card,.conn{stroke:#b5d7c8}.arrow{fill:#b5d7c8}}</style>
<defs><marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="arrow" d="M0 0 L7 3.5 L0 7Z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="430" rx="12"/>
<text class="title" text-anchor="start" x="36" y="48">Running the equipment library</text>
<text class="body muted" text-anchor="start" x="36" y="80">Compose starts the API after migrations finish. Each module connects using its own database role.</text>
<rect class="frame" x="16" y="112" width="968" height="178" rx="12"/>
<text class="cap" text-anchor="start" x="32" y="135">Local Compose deployment</text>
<g id="reader">
<rect class="card a" x="36" y="169" width="245" height="98" rx="8"/>
<text class="name" text-anchor="start" x="49" y="198">Member or librarian</text>
<text class="body" text-anchor="start" x="49" y="224">HTTP demo journey</text>
<text class="body muted" text-anchor="start" x="49" y="246">Borrower or staff identity</text>
</g>
<g id="api">
<rect class="card b" x="377" y="169" width="245" height="98" rx="8"/>
<text class="name" text-anchor="start" x="390" y="198">ASP.NET Core host</text>
<text class="body" text-anchor="start" x="390" y="224">Request endpoints</text>
<text class="body muted" text-anchor="start" x="390" y="246">Relay and inbox workers</text>
</g>
<g id="database">
<rect class="card c" x="718" y="169" width="245" height="98" rx="8"/>
<text class="name" text-anchor="start" x="731" y="198">PostgreSQL</text>
<text class="body" text-anchor="start" x="731" y="224">One database, three schemas</text>
<text class="body muted" text-anchor="start" x="731" y="246">Three module runtime roles</text>
</g>
<g id="http"><path d="M284 218 H372" class="conn" marker-end="url(#arrowhead)"/>
<text class="edge-label" text-anchor="middle" x="328" y="207">HTTP</text>
</g>
<g id="sql"><path d="M625 218 H713" class="conn" marker-end="url(#arrowhead)"/>
<text class="edge-label" text-anchor="middle" x="669" y="207">SQL</text>
</g>
<rect class="frame" x="16" y="331" width="968" height="79" rx="10"/>
<text class="cap" text-anchor="start" x="32" y="357">Startup order</text>
<text class="body muted" text-anchor="start" x="32" y="383">PostgreSQL becomes healthy, migrations complete, then the API starts its request and background workers.</text>
</svg>
